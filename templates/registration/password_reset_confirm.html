{% extends 'base.html' %}

{% block title %}設定新密碼｜線上個人課表{% endblock %}

{% block content %}
<section class="card auth-card">
  {% if validlink %}
    <h1>設定新密碼</h1>
    <form method="post">
      {% csrf_token %}
      {% include '_form_fields.html' %}
      <button type="submit" class="button button-block">更新密碼</button>
    </form>
  {% else %}
    <h1>連結已失效</h1>
    <p>這個重設密碼連結已經用過或已過期。</p>
    <p class="auth-switch"><a href="{% url 'password_reset' %}">重新寄一封重設密碼信</a></p>
  {% endif %}
</section>
{% endblock %}

{% extends 'base.html' %}

{% block title %}註冊｜線上個人課表{% endblock %}

{% block content %}
<section class="card auth-card">
  <h1>註冊</h1>
  <form method="post">
    {% csrf_token %}
    {% include '_form_fields.html' %}
    <button type="submit" class="button button-block">建立帳號</button>
  </form>
  <p class="auth-switch">已經有帳號了？<a href="{% url 'login' %}">登入</a></p>
</section>
{% endblock %}

{% extends 'base.html' %}

{% block title %}已寄出重設密碼信｜線上個人課表{% endblock %}

{% block content %}
<section class="card auth-card">
  <h1>請查收信件</h1>
  {# 不透露這個 Email 是否有註冊，避免被拿來查詢帳號 #}
  <p>如果這個 Email 有註冊帳號，重設密碼的信已經寄出，請在 24 小時內點信中的連結。</p>
  <p class="muted">沒收到的話，請檢查垃圾郵件匣，或確認輸入的 Email 是否正確。</p>
  <p class="auth-switch"><a href="{% url 'login' %}">回到登入</a></p>
</section>
{% endblock %}

{% extends 'base.html' %}

{% block title %}忘記密碼｜線上個人課表{% endblock %}

{% block content %}
<section class="card auth-card">
  <h1>忘記密碼</h1>
  <p class="muted">輸入註冊時填寫的 Email，我們會寄一封重設密碼的信給你。</p>
  <form method="post">
    {% csrf_token %}
    {% include '_form_fields.html' %}
    <button type="submit" class="button button-block">寄出重設密碼信</button>
  </form>
  <p class="auth-switch"><a href="{% url 'login' %}">回到登入</a></p>
</section>
{% endblock %}

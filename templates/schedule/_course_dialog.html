{% load i18n %}
{# 課程詳細資料視窗；內容由 static/js/timetable.js 依 course-details 填入 #}
<dialog id="course-dialog" class="course-dialog" aria-labelledby="dialog-title">
  <div class="dialog-header" id="dialog-header">
    <h2 id="dialog-title"></h2>
    <button type="button" class="dialog-close" data-close aria-label="{% translate 'Close' %}">✕</button>
  </div>
  <dl class="dialog-body">
    <dt>{% translate "Category" %}</dt><dd><span class="tag" id="dialog-category"></span></dd>
    <dt>{% translate "Teacher" %}</dt><dd id="dialog-teacher"></dd>
    <dt>{% translate "Classroom" %}</dt><dd id="dialog-classroom"></dd>
    <dt>{% translate "Credits" %}</dt><dd id="dialog-credits"></dd>
    <dt>{% translate "Times" %}</dt><dd id="dialog-times"></dd>
    <dt>{% translate "Note" %}</dt><dd id="dialog-note"></dd>
  </dl>
  <div class="dialog-actions" id="dialog-actions">
    <a class="button button-outline" id="dialog-edit">{% translate "Edit" %}</a>
    <a class="button button-danger" id="dialog-delete">{% translate "Delete" %}</a>
  </div>
</dialog>
